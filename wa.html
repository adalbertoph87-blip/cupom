<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Oops, something lost</title>
<meta name="description" content="Oops, looks like the page is lost.">
<style>
body{font-family:'Open Sans',sans-serif;margin:0;padding:0;background:#fff}
.error{display:flex;align-items:center;justify-content:center;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:20px;text-align:center}
.content img{max-width:100%;height:auto;width:500px}
h1{font-size:28px;color:#333;margin:20px 0}
.sub-header{font-size:22px;color:#666;max-width:600px;margin:0 auto}
@media(max-width:768px){.content img{width:300px}h1{font-size:24px}.sub-header{font-size:18px}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="error">
<div class="container">
<div class="content">
<img src="/htdocs_error/something-lost.png" alt="Page not found">
<h1>Oops, looks like the page is lost.</h1>
<p class="sub-header">This is not a fault, just an accident that was not intentional.</p>
</div>
</div>
</div>
</body>
</html>
