  <style>
/* ===== KWIK — Design System ===== */
:root {
  /* Core brand palette */
  --brand: #1a1a2e;
  --brand-foreground: #fffbe6;
  --brand-red: #e63946;
  --brand-orange: #f59e0b;   /* deeper amber */
  --brand-green: #2ec4b6;

  /* Surfaces */
  --background: #f7f5f0;
  --card: #ffffff;
  --secondary: #f0ede6;
  --accent: #f59e0b;         /* deep amber yellow — matches site */
  --accent-foreground: #1a1a2e;
  --muted: #e8e5de;

  /* Text */
  --foreground: #1a1a2e;
  --muted-foreground: #8a8680;

  /* Misc */
  --border: #e0ddd6;
  --input: #d5d2cc;
  --destructive: #e63946;
  --ring: #f59e0b;
  --radius: 12px;
  --success-surface: #dcfce7;
  --success-ink: #166534;

  /* Fonts */
  --font-display: 'Archivo', system-ui, sans-serif;
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

/* ===== Reset ===== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: 0 solid transparent;
}

html {
  -webkit-text-size-adjust: 100%;
  line-height: 1.5;
  font-family: var(--font-display);
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--background);
  color: var(--foreground);
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
input { background: none; border: none; outline: none; }
ol, ul { list-style: none; }

/* ===== App container (mobile-first, max-width 28rem) ===== */
#app {
  max-width: 28rem;
  margin: 0 auto;
  min-height: 100vh;
}

/* ===== Utility classes ===== */
.hidden { display: none !important; }
.text-center { text-align: center; }
.text-left { text-align: left; }
.text-right { text-align: right; }
.w-full { width: 100%; }
.mx-auto { margin-left: auto; margin-right: auto; }
.relative { position: relative; }
.absolute { position: absolute; }
.flex { display: flex; }
.inline-flex { display: inline-flex; }
.grid { display: grid; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.items-end { align-items: flex-end; }
.justify-between { justify-content: space-between; }
.justify-center { justify-content: center; }
.flex-1 { flex: 1; }
.shrink-0 { flex-shrink: 0; }
.gap-1 { gap: 0.25rem; }
.gap-2 { gap: 0.5rem; }
.gap-3 { gap: 0.75rem; }
.gap-4 { gap: 1rem; }
.select-none { user-select: none; -webkit-user-select: none; }
.overflow-hidden { overflow: hidden; }
.grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* ===== KWIK Logo ===== */
.kwik-logo {
  display: inline-flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1;
  user-select: none;
}

.kwik-logo__word {
  font-family: var(--font-display);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: -0.05em;
  color: var(--brand);
  transform: skewX(-8deg);
}

.kwik-logo__word--sm { font-size: 1.5rem; }
.kwik-logo__word--md { font-size: 2.25rem; }
.kwik-logo__word--lg { font-size: 3.75rem; }

.kwik-logo__i {
  position: relative;
  display: inline-block;
}

.kwik-logo__tri {
  position: absolute;
  right: 0;
  top: 0;
  background: var(--accent);
  clip-path: polygon(100% 0, 0 0, 100% 100%);
}

.kwik-logo__tri--sm { width: 0.375rem; height: 0.375rem; }
.kwik-logo__tri--md { width: 0.5rem; height: 0.5rem; }
.kwik-logo__tri--lg { width: 0.75rem; height: 0.75rem; }

.kwik-logo__sub {
  margin-top: 0.25rem;
  font-family: var(--font-display);
  font-weight: 600;
  text-transform: lowercase;
  letter-spacing: -0.025em;
  color: var(--brand-red);
}

.kwik-logo__sub--sm { font-size: 0.5rem; }
.kwik-logo__sub--md { font-size: 0.65rem; }
.kwik-logo__sub--lg { font-size: 0.95rem; }

/* ===== Header curved ===== */
.header-curved {
  position: relative;
  overflow: hidden;
  border-bottom-left-radius: 45%;
  border-bottom-right-radius: 45%;
  background: var(--card);
  padding: 1.5rem 1.5rem 2.5rem;
  box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1);
}

/* ===== Header bar (app pages) ===== */
.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  border-bottom: 1px solid var(--border);
  background: var(--card);
  padding: 0.75rem 1rem;
}

.balance-badge {
  border-radius: 0.75rem;
  border: 2px solid var(--accent);
  padding: 0.25rem 0.75rem;
  text-align: right;
  background: rgba(245,158,11,0.08);
}

.balance-badge__label {
  font-size: 0.55rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--muted-foreground);
}

.balance-badge__value {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--brand);
}

/* ===== Menu icon ===== */
.menu-btn {
  margin-top: 0.25rem;
  padding: 0.25rem;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.menu-btn svg {
  width: 2rem;
  height: 2rem;
  color: var(--brand);
}

/* ===== Typography ===== */
.heading-welcome {
  margin-top: 3rem;
  text-align: center;
  font-family: var(--font-serif);
  font-size: 3rem;
  font-weight: 900;
  color: var(--brand);
  line-height: 1;
}

.subtitle-welcome {
  margin: 1rem auto 0;
  max-width: 20rem;
  text-align: center;
  font-size: 1rem;
  color: var(--brand);
}

.heading-page {
  text-align: center;
  font-family: var(--font-display);
  font-size: 1.875rem;
  font-weight: 900;
  color: var(--brand);
}

.subtitle-page {
  margin-top: 0.25rem;
  text-align: center;
  font-size: 1rem;
  color: var(--muted-foreground);
}

/* ===== Divider bar ===== */
.divider-bar {
  margin: 1rem auto 0;
  height: 0.25rem;
  width: 3.5rem;
  border-radius: 9999px;
  background: var(--brand-orange);
}

/* ===== Step cards (homepage) ===== */
.step-cards {
  margin-top: 3rem;
  padding: 0 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.step-card {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 1rem;
  border-radius: 1rem;
  padding: 1.5rem 1.25rem;
  text-align: left;
  transition: transform 0.15s;
}

.step-card:active { transform: scale(0.99); }

.step-card--active {
  background: #fef3c7;
  border: 2px solid var(--accent);
}

.step-card--disabled {
  background: var(--secondary);
}

.step-circle {
  display: flex;
  width: 3.5rem;
  height: 3.5rem;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  border-radius: 9999px;
  border: 2px solid;
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
}

.step-circle--active {
  border-color: var(--brand);
  color: var(--brand);
}

.step-circle--disabled {
  border-color: rgba(138,134,128,0.5);
  color: rgba(138,134,128,0.6);
}

.step-title {
  display: block;
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 700;
}

.step-title--active { color: var(--brand); }
.step-title--disabled { color: rgba(138,134,128,0.7); }

.step-desc {
  display: block;
  margin-top: 0.25rem;
  font-size: 0.875rem;
  line-height: 1.375;
}

.step-desc--active { color: var(--brand); }
.step-desc--disabled { color: rgba(138,134,128,0.6); }

.step-chevron {
  width: 1.5rem;
  height: 1.5rem;
  color: var(--brand);
}

/* ===== Stepper (cadastro) ===== */
.stepper {
  margin-top: 2rem;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
}

.stepper__item {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
}

.stepper__track {
  display: flex;
  width: 100%;
  align-items: center;
}

.stepper__line {
  height: 1px;
  flex: 1;
}

.stepper__line--border { background: var(--border); }
.stepper__line--transparent { background: transparent; }

.stepper__dot {
  display: flex;
  width: 2.25rem;
  height: 2.25rem;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  border-radius: 9999px;
  font-size: 0.875rem;
  font-weight: 700;
}

.stepper__dot--active {
  background: var(--accent);
  color: #1a1a2e;
  font-weight: 900;
}

.stepper__dot--inactive {
  border: 1px solid var(--border);
  color: var(--muted-foreground);
}

.stepper__label {
  margin-top: 0.5rem;
  font-size: 0.75rem;
  font-weight: 600;
}

.stepper__label--active { color: var(--accent); font-weight: 800; }
.stepper__label--inactive { color: var(--muted-foreground); }

/* ===== Form elements ===== */
.form-label {
  display: block;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--brand);
}

.form-input-wrap {
  position: relative;
  margin-top: 0.5rem;
}

.form-input-wrap svg {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  width: 1.25rem;
  height: 1.25rem;
  color: var(--muted-foreground);
}

.form-input {
  width: 100%;
  border-radius: 0.75rem;
  border: 1px solid var(--input);
  background: var(--card);
  padding: 1rem 3rem 1rem 3rem;
  font-size: 1rem;
  color: var(--foreground);
  outline: none;
  transition: border-color 0.15s;
}

.form-input::placeholder {
  color: var(--muted-foreground);
}

.form-input:focus {
  border-color: var(--brand-orange);
}

/* Phone input */
.phone-wrap {
  margin-top: 0.5rem;
  display: flex;
  align-items: stretch;
  overflow: hidden;
  border-radius: 0.75rem;
  border: 1px solid var(--input);
  background: var(--card);
}

.phone-prefix {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  border-right: 1px solid var(--input);
  background: var(--secondary);
  padding: 0 0.75rem;
}

.phone-prefix__flag { font-size: 1.125rem; }
.phone-prefix__code { font-size: 1rem; font-weight: 600; color: var(--foreground); }

.phone-prefix__chevron {
  width: 1rem;
  height: 1rem;
  color: var(--muted-foreground);
}

.phone-prefix select {
  position: absolute;
  inset: 0;
  cursor: pointer;
  opacity: 0;
  width: 100%;
  height: 100%;
}

.phone-input {
  flex: 1;
  background: var(--card);
  padding: 1rem;
  font-size: 1rem;
  color: var(--foreground);
  outline: none;
  border: none;
}

.phone-input::placeholder {
  color: var(--muted-foreground);
}

/* ===== Security notice ===== */
.security-notice {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  border-radius: 0.75rem;
  background: rgba(244, 162, 97, 0.1);
  padding: 1rem;
}

.security-notice svg {
  margin-top: 0.125rem;
  width: 1.75rem;
  height: 1.75rem;
  flex-shrink: 0;
  color: var(--brand-orange);
}

.security-notice__title {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 700;
  color: var(--brand);
}

.security-notice__desc {
  font-size: 0.875rem;
  color: var(--muted-foreground);
}

/* ===== Buttons ===== */
.btn-primary {
  width: 100%;
  border-radius: 0.75rem;
  background: var(--accent);
  padding: 1rem;
  font-family: var(--font-display);
  font-size: 1.125rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--brand);
  transition: transform 0.1s, filter 0.15s;
  cursor: pointer;
  border: none;
  box-shadow: 0 4px 12px rgba(245,158,11,0.35);
}
.btn-primary:hover { filter: brightness(1.08); }

.btn-primary:active { transform: scale(0.99); }

.btn-ghost {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--brand);
  background: none;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  transition: background 0.15s;
  cursor: pointer;
}

.btn-ghost:hover { background: var(--accent); }

.btn-ghost svg {
  width: 1.25rem;
  height: 1.25rem;
}

.btn-validate {
  margin-top: 1rem;
  width: 100%;
  border-radius: 0.75rem;
  background: var(--accent);
  padding: 1rem;
  font-family: var(--font-display);
  font-size: 0.875rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--brand);
  transition: transform 0.1s, filter 0.15s;
  cursor: pointer;
  border: none;
  box-shadow: 0 4px 12px rgba(245,158,11,0.35);
}

.btn-validate:active { transform: scale(0.99); }
.btn-validate:hover { filter: brightness(1.08); }

/* ===== Back button ===== */
.back-btn {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  padding: 0.25rem;
  color: var(--brand);
  background: none;
  border: none;
  cursor: pointer;
}

.back-btn svg {
  width: 1.75rem;
  height: 1.75rem;
}

/* ===== Error message ===== */
.error-msg {
  border-radius: 0.75rem;
  background: rgba(230, 57, 70, 0.1);
  padding: 0.75rem;
  text-align: center;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--destructive);
}

/* ===== Success modal (cadastro) ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(26,26,46,0.6);
  padding: 1.5rem;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.modal-card {
  width: 100%;
  max-width: 24rem;
  border-radius: 1.5rem;
  background: var(--card);
  padding: 2rem;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  animation: modalIn 0.3s ease-out;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.modal-icon {
  margin: 0 auto;
  display: flex;
  width: 4rem;
  height: 4rem;
  align-items: center;
  justify-content: center;
  border-radius: 9999px;
}

.modal-icon--success {
  background: rgba(46,196,182,0.15);
}

.modal-icon--success svg {
  width: 2rem;
  height: 2rem;
  color: var(--brand-green);
}

.modal-icon--party {
  background: rgba(255,251,230,0.2);
}

.modal-icon--party svg {
  width: 2rem;
  height: 2rem;
  color: var(--brand-foreground);
}

.modal-title {
  margin-top: 1.5rem;
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--brand);
}

.modal-text {
  margin-top: 0.75rem;
  font-size: 1rem;
  font-weight: 600;
  color: var(--foreground);
}

.modal-text-sm {
  margin-top: 0.75rem;
  font-size: 0.875rem;
  color: var(--muted-foreground);
}

.modal-text-orange {
  margin-top: 1rem;
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--brand-orange);
}

.modal-progress-track {
  margin: 1.5rem auto 0;
  height: 0.375rem;
  width: 8rem;
  overflow: hidden;
  border-radius: 9999px;
  background: var(--secondary);
}

.modal-progress-bar {
  height: 100%;
  border-radius: 9999px;
  background: var(--brand-orange);
  animation: shrinkBar 6s linear forwards;
}

@keyframes shrinkBar {
  from { width: 100%; }
  to { width: 0%; }
}

/* ===== Prize modal (app) ===== */
.prize-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.6);
  padding: 1rem;
}

.prize-modal {
  position: relative;
  width: 100%;
  max-width: 24rem;
  border-radius: 1.5rem;
  background: var(--brand);
  padding: 2rem;
  text-align: center;
  color: var(--brand-foreground);
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  animation: modalIn 0.3s ease-out;
}

.prize-close {
  position: absolute;
  right: 1rem;
  top: 1rem;
  border-radius: 9999px;
  padding: 0.25rem;
  opacity: 0.8;
  background: none;
  border: none;
  color: var(--brand-foreground);
  cursor: pointer;
}

.prize-close:hover { opacity: 1; }

.prize-close svg {
  width: 1.25rem;
  height: 1.25rem;
}

.prize-label {
  margin-top: 1.25rem;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  opacity: 0.9;
}

.prize-heading {
  margin-top: 0.25rem;
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 900;
  text-transform: uppercase;
  line-height: 1.25;
  letter-spacing: 0.05em;
}

.prize-value {
  margin-top: 1rem;

.loading-page {

  padding: 2rem;
  text-align: center;
}

.spinner-wrap {
  position: relative;
  width: 4rem;
  height: 4rem;
}

.spinner-outer {
  width: 4rem;
  height: 4rem;
  border-radius: 9999px;
  border: 4px solid var(--brand-orange);

}

.spinner-inner {
  position: absolute;

  to { transform: rotate(360deg); }
}

.loading-title {
  margin-top: 2rem;

  color: var(--brand);
}

.loading-subtitle {
  margin-top: 0.5rem;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--muted-foreground);
}

/* ===== Page padding ===== */
.page-padded {
  padding: 1.5rem;
  padding-bottom: 2.5rem;
}

.page-main {
  background: var(--background);

  padding-bottom: 2.5rem;
}

/* ===== Space ===== */
.mt-1 { margin-top: 0.25rem; }

function formatKz(value) {
  const fixed = value.toFixed(2);
  const dotIndex = fixed.lastIndexOf('.');
  const intPart = fixed.slice(0, dotIndex);
  const decPart = fixed.slice(dotIndex + 1);
  return `Kz ${intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.')},${decPart}`;
}

function bindSaque() {
  let method = 'express';

  document.getElementById('btn-back-saque')?.addEventListener('click', () => navigate('/'));

  const expressBtn = document.getElementById('method-express');
  const ibanBtn = document.getElementById('method-iban');
  const contaLabel = document.getElementById('conta-label');
  const contaInput = document.getElementById('conta');

  expressBtn?.addEventListener('click', () => {
    method = 'express';
    expressBtn.className = 'method-btn method-btn--active';
    expressBtn.setAttribute('aria-pressed', 'true');
    ibanBtn.className = 'method-btn method-btn--inactive';
    ibanBtn.setAttribute('aria-pressed', 'false');
    contaLabel.textContent = 'Número Multicaixa Express';
    contaInput.placeholder = '900 000 000';
    contaInput.value = '';
  });

  ibanBtn?.addEventListener('click', () => {
    method = 'iban';
    ibanBtn.className = 'method-btn method-btn--active';
    ibanBtn.setAttribute('aria-pressed', 'true');
    expressBtn.className = 'method-btn method-btn--inactive';
    expressBtn.setAttribute('aria-pressed', 'false');
    contaLabel.textContent = 'IBAN (após AO06)';
    contaInput.placeholder = '000000000000000000000';
    contaInput.value = '';
  });

  contaInput?.addEventListener('input', () => {
    const max = method === 'express' ? 9 : 21;
    contaInput.value = contaInput.value.replace(/\D/g, '').slice(0, max);
  });

  document.getElementById('saque-form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const holder = document.getElementById('titular').value.trim();
    const account = contaInput.value.trim();
    const errorEl = document.getElementById('saque-error');

    if (!holder) {
      errorEl.textContent = 'Indique o nome do titular.';
      errorEl.classList.remove('hidden');
      return;
    }

    if (method === 'express' && !/^\d{9}$/.test(account)) {
      errorEl.textContent = 'Indique um número Multicaixa Express válido (9 dígitos).';
      errorEl.classList.remove('hidden');
      return;
    }

    if (method === 'iban' && !/^\d{21}$/.test(account)) {
      errorEl.textContent = 'Indique um IBAN válido (21 dígitos após AO06).';
      errorEl.classList.remove('hidden');
      return;
    }

    errorEl.classList.add('hidden');
    store.withdrawalDetails = { method, holder, account };
    store.lastWithdrawal = store.balance || TOTAL_VALUE;

    if (window.MetaTracker) {
      window.MetaTracker.setUserData({
        name: holder,
        phone: method === 'express' && !store.phone ? account : undefined,
        countryCode: '+244',
      });
      window.MetaTracker.track('AddPaymentInfo', {
        content_name: 'Metodo de Retirada KWIK',
        content_category: method,
        currency: 'AOA',
        value: store.lastWithdrawal,
      });
    }

    navigate('/app');
  });
}

function renderApp() {
  if (!store.registered) {
    navigate('/');
    return '';
  }

  const currentStep = Math.min(store.couponStep, COUPONS.length);
  const allDone = currentStep >= COUPONS.length;
  const coupon = allDone ? null : COUPONS[currentStep];

  // Step counter dots
  function stepDots() {
    return `
      <div class="step-dots">
        ${COUPONS.map((c, i) => `
          <div class="step-dot ${i < currentStep ? 'step-dot--done' : i === currentStep ? 'step-dot--current' : 'step-dot--pending'}"></div>
        `).join('')}
      </div>
    `;
  }

  let mainContent = '';
  if (coupon) {
    mainContent = `
      ${stepDots()}
      <div class="coupon-step-label">Etapa ${coupon.step} de ${COUPONS.length}</div>
      <img
        src="${coupon.image}"
        alt="Cupom ${coupon.brand} — código ${coupon.code}"
        class="coupon-img"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
      />
      <div class="coupon-fallback" style="display:none;">
        <div class="coupon-fallback__inner">
          <p class="coupon-fallback__label">Cupom de desconto</p>
          <h3 class="coupon-fallback__brand">${coupon.brand}</h3>
          <div class="coupon-fallback__code">${coupon.code}</div>
          <p class="coupon-fallback__value">Valor: <strong>${formatKz(coupon.value)}</strong></p>
        </div>
      </div>
      <form id="validate-form" class="mt-6">
        <label class="coupon-code-label">Código KWIK</label>
        <input id="coupon-input"
          inputmode="numeric"
          placeholder="Digite os 8 dígitos do KWIK"
          class="coupon-code-input coupon-code-input--default"
          value=""
          maxlength="8"
        />
        <button type="submit" class="btn-validate">Validar KWIK</button>
      </form>
    `;
  } else {
    mainContent = `
      <section class="final-card">
        <p class="final-card__label">Saldo final</p>
        <p class="final-card__value">${formatKz(TOTAL_VALUE)}</p>
        <p class="final-card__desc">Você validou os ${COUPONS.length} cupons da campanha KWIK.</p>
        <button type="button" class="final-card__btn" id="btn-levantamento">Levantar saldo</button>
      </section>
    `;
  }

  return `
    <div class="page-main animate-fade-in">
      ${headerBar()}
      <main style="padding: 1.25rem 1rem;">
        <div class="app-status ${allDone ? 'app-status--orange' : 'app-status--green'}">
          ${allDone ? Icons.partyPopper : Icons.circleCheck}
          <span class="app-status__text">${allDone ? 'Todos os KWIK validados!' : 'Novo KWIK localizado!'}</span>
        </div>
        <div class="mt-6"></div>
        ${mainContent}
        <div id="app-feedback" class="app-feedback hidden"></div>
      </main>
    </div>
  `;
}

function bindApp() {
  const input = document.getElementById('coupon-input');
  const currentStep = Math.min(store.couponStep, COUPONS.length);
  const coupon = currentStep < COUPONS.length ? COUPONS[currentStep] : null;

  if (input && coupon) {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '').slice(0, 8);
      const val = input.value;
      const startsCorrect = coupon.code.startsWith(val);
      const isComplete = val.length === 8 && startsCorrect;

      input.className = 'coupon-code-input';
      if (val.length === 0) {
        input.classList.add('coupon-code-input--default');
      } else if (isComplete) {
        input.classList.add('coupon-code-input--valid');
      } else if (startsCorrect) {
        input.classList.add('coupon-code-input--partial');
      } else {
        input.classList.add('coupon-code-input--invalid');
      }
    });
  }

  document.getElementById('validate-form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!coupon) return;

    const val = input.value.trim();
    const feedbackEl = document.getElementById('app-feedback');

    const alreadyUsed = store.history.some(h => h.code === val);
    const matchOther = COUPONS.find(c => c.code === val);

    if (val !== coupon.code) {
      let msg = 'Código inválido. Confira os 8 dígitos do KWIK.';
      if (alreadyUsed) msg = 'Este KWIK já foi validado. Use o código do cupom atual.';
      else if (matchOther) msg = `Ainda não é a vez deste KWIK. Valide primeiro o cupom ${coupon.step}.`;

      feedbackEl.textContent = msg;
      feedbackEl.classList.remove('hidden');
      return;
    }

    // Success!
    const newBalance = store.balance + coupon.value;
    store.balance = newBalance;
    store.couponStep = currentStep + 1;
    store.history.unshift({
      id: Date.now().toString(),
      code: coupon.code,
      value: coupon.value,
      date: new Date().toISOString()
    });

    feedbackEl.classList.add('hidden');
    window.MetaTracker?.trackCustom('CouponValidated', {
      step: coupon.step,
      brand: coupon.brand,
      coupon_code: coupon.code,
      value: coupon.value,
      total_balance: newBalance,
      currency: 'AOA',
    });
    showPrizeModal(coupon.value);
  });

  document.getElementById('btn-levantamento')?.addEventListener('click', () => {
    window.MetaTracker?.trackCustom('WithdrawalRequested', {
      value: store.balance || TOTAL_VALUE,
      currency: 'AOA',
    });
    navigate('/levantamento');
  });
}

function showPrizeModal(value) {
  const overlay = document.getElementById('modal-overlay');
  overlay.innerHTML = `
    <div class="prize-modal-overlay" id="prize-overlay-bg">
      <div class="prize-modal" id="prize-modal-card">
        <button class="prize-close" id="prize-close-btn" aria-label="Fechar">
          ${Icons.x}
        </button>
        <div class="modal-icon modal-icon--party">
          ${Icons.partyPopper}
        </div>
        <p class="prize-label">Parabéns!</p>
        <h2 class="prize-heading">Você ganhou!</h2>
        <p class="prize-value">+${formatKz(value)}</p>
        <button class="prize-continue" id="prize-continue-btn">Continuar</button>
      </div>
    </div>
  `;
  overlay.classList.remove('hidden');
  overlay.style.display = 'block';

  function closePrize() {
    overlay.classList.add('hidden');
    overlay.style.display = '';
    overlay.innerHTML = '';
    renderPage(true);
  }

  document.getElementById('prize-close-btn')?.addEventListener('click', closePrize);
  document.getElementById('prize-continue-btn')?.addEventListener('click', closePrize);
  document.getElementById('prize-overlay-bg')?.addEventListener('click', (e) => {
    if (e.target.id === 'prize-overlay-bg') closePrize();
  });

  setTimeout(closePrize, 3500);
}

// ===== Router & Rendering =====
let currentRoute = null;

function renderPage(force = false) {
  const route = getCurrentRoute();
  if (!force && route === currentRoute) return;
  const isRouteChange = currentRoute !== route;
  currentRoute = route;


  const app = document.getElementById('app');
  let html = '';
  let bind = null;

  switch (route) {
    case '/':
      html = renderHome();
      bind = bindHome;
      break;
    case '/cadastro':
      html = renderCadastro();
      bind = bindCadastro;
      break;
    case '/saque':
      html = renderSaque();
      bind = bindSaque;
      break;
    case '/app':
      html = renderApp();
      bind = bindApp;
      break;
    case '/levantamento':
      html = renderLevantamento();
      bind = bindLevantamento;
      break;
    case '/saque-sucesso':
      html = renderSaqueSucesso();
      bind = bindSaqueSucesso;
      break;
    case '/multicaixa':
      html = renderMulticaixa();
      bind = bindMulticaixa;
      break;
    case '/vsl':
      html = renderVsl();
      bind = bindVsl;
      break;
    case '/desconto':
      html = renderDesconto();
      bind = bindDesconto;
      break;
    case '/bak1':
      html = renderBak1();
      bind = bindBak1;
      break;
    default:
      html = renderHome();
      bind = bindHome;
      break;
  }

  if (route !== '/') {
    document.body.style.backgroundColor = '';
  }

  app.innerHTML = html;
  if (bind) bind();
  if (isRouteChange && html) {
    window.scrollTo(0, 0);
    window.MetaTracker?.trackRoute(route, store.lastWithdrawal || store.balance || TOTAL_VALUE);
  }
}

// Initial render
if (document.readyState === 'loading') {

} else {

}
